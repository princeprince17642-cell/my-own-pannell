name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          mkdir -p my_app
          unzip -o *.zip -d my_app
          
          # Root directory setup
          if [ -f "my_app/gradlew" ]; then
            echo "ROOT_DIR=my_app" >> $GITHUB_ENV
          else
            INNER_DIR=$(find my_app -name "gradlew" -exec dirname {} \;)
            echo "ROOT_DIR=$INNER_DIR" >> $GITHUB_ENV
          fi

      - name: Make Gradlew Executable & Build APK
        run: |
          cd ${{ env.ROOT_DIR }}
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAANWIN-PANNEL-APK
          path: '${{ env.ROOT_DIR }}/app/build/outputs/apk/debug/*.apk'
